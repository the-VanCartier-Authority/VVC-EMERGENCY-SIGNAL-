name: VVC-EMERGENCY-SIGNAL CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download Full Gradle Wrapper (Shell & Jar)
      run: |
        # Descargar el script ejecutable
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
        chmod +x gradlew
        
        # Crear la estructura de carpetas necesaria
        mkdir -p gradle/wrapper
        
        # Descargar el binario .jar ejecutable que faltaba
        curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Compiled APK Artifact
      uses: actions/actions/upload-artifact@v4
      with:
        name: vvc-emergency-signal-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
