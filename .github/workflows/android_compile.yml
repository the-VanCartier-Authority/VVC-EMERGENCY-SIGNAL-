name: VVC-EMERGENCY-SIGNAL CI

on:
  push:
    branches: ["main", "repair/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Make Gradle bootstrap executable
        run: chmod +x gradlew
      - name: Validate Gradle wrapper
        run: ./gradlew --version
      - name: Compile debug
        run: ./gradlew assembleDebug
      - name: Compile release test APK
        run: ./gradlew assembleRelease -PciDebugSignRelease=true
      - name: Verify release test APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk
      - name: Run unit tests
        run: ./gradlew test
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vvc-emergency-signal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vvc-emergency-signal-release-test-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
